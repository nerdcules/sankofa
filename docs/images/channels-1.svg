<svg color="#1B2430" font-family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif" viewBox="0 0 1000 620" role="img" aria-label="The main session spawns subagents, forks, a team and workflow agents. Each worker has its own context window; only a text prompt goes in and only a final report or message comes back." xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#F5F7FA"/>
<style>.mono { font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace; }</style>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/>
    </marker>
  </defs>

  <!-- Main session -->
  <rect x="30" y="250" width="230" height="130" rx="4" fill="#D8EEF4" stroke="#1B2430" stroke-width="1.5"/>
  <text x="145" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#1B2430">Main session</text>
  <text x="145" y="304" text-anchor="middle" font-size="12" fill="#5E6B7A">your context window</text>
  <text x="145" y="330" text-anchor="middle" font-size="11.5" class="mono" fill="#1B2430">sees: final reports only</text>
  <text x="145" y="348" text-anchor="middle" font-size="11.5" class="mono" fill="#1B2430">never sees: their tool calls</text>
  <text x="145" y="366" text-anchor="middle" font-size="11.5" class="mono" fill="#1B2430">plain text out ≠ a message</text>

  <!-- Spine -->
  <line x1="300" y1="75" x2="300" y2="555" stroke="#1B2430" stroke-width="1.5"/>
  <line x1="260" y1="315" x2="300" y2="315" stroke="#1B2430" stroke-width="1.5"/>

  <!-- Row A: Subagent -->
  <line x1="300" y1="75" x2="560" y2="75" stroke="#1B2430" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="430" y="68" text-anchor="middle" font-size="11.5" fill="#1B2430">task prompt (text)</text>
  <line x1="560" y1="105" x2="300" y2="105" stroke="#0E7490" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="430" y="122" text-anchor="middle" font-size="11.5" fill="#0E7490">final report only</text>
  <line x1="300" y1="135" x2="560" y2="135" stroke="#1B2430" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <text x="430" y="152" text-anchor="middle" font-size="11" fill="#5E6B7A">SendMessage by name resumes it</text>

  <rect x="560" y="40" width="200" height="120" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.5"/>
  <text x="660" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2430">Subagent</text>
  <text x="660" y="86" text-anchor="middle" font-size="12" fill="#5E6B7A">fresh, empty context</text>
  <text x="660" y="106" text-anchor="middle" font-size="11.5" class="mono" fill="#1B2430">background by default</text>
  <text x="660" y="124" text-anchor="middle" font-size="11.5" class="mono" fill="#1B2430">keeps its own transcript</text>
  <text x="660" y="142" text-anchor="middle" font-size="11.5" class="mono" fill="#1B2430">20 concurrent · nests 3 deep</text>

  <line x1="760" y1="100" x2="820" y2="100" stroke="#1B2430" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <rect x="820" y="70" width="150" height="60" rx="4" fill="none" stroke="#1B2430" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="895" y="95" text-anchor="middle" font-size="12" fill="#1B2430">its own subagents</text>
  <text x="895" y="113" text-anchor="middle" font-size="11" fill="#5E6B7A">same rules, one level down</text>

  <!-- Row B: Fork -->
  <line x1="300" y1="205" x2="560" y2="205" stroke="#1B2430" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="430" y="198" text-anchor="middle" font-size="11.5" fill="#1B2430">copy of your whole conversation</text>
  <line x1="560" y1="235" x2="300" y2="235" stroke="#0E7490" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="430" y="252" text-anchor="middle" font-size="11.5" fill="#0E7490">final result only</text>

  <rect x="560" y="180" width="200" height="96" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.5"/>
  <text x="660" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2430">Fork</text>
  <text x="660" y="226" text-anchor="middle" font-size="12" fill="#5E6B7A">inherits context, model, tools</text>
  <text x="660" y="246" text-anchor="middle" font-size="11.5" class="mono" fill="#1B2430">shares your prompt cache</text>
  <text x="660" y="264" text-anchor="middle" font-size="11.5" class="mono" fill="#B45309">cannot fork again</text>

  <!-- Row C: Team -->
  <line x1="300" y1="330" x2="560" y2="330" stroke="#1B2430" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="430" y="323" text-anchor="middle" font-size="11.5" fill="#1B2430">spawn prompt, then named messages</text>
  <line x1="560" y1="360" x2="300" y2="360" stroke="#0E7490" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="430" y="377" text-anchor="middle" font-size="11.5" fill="#0E7490">named messages · idle notice with answer</text>

  <rect x="560" y="300" width="200" height="130" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.5"/>
  <text x="660" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#1B2430">Agent team</text>
  <text x="660" y="342" text-anchor="middle" font-size="11.5" fill="#5E6B7A">you are the fixed lead</text>
  <!-- teammates -->
  <rect x="580" y="356" width="48" height="26" rx="3" fill="#D8EEF4" stroke="#1B2430" stroke-width="1"/>
  <text x="604" y="373" text-anchor="middle" font-size="11" class="mono" fill="#1B2430">t1</text>
  <rect x="636" y="356" width="48" height="26" rx="3" fill="#D8EEF4" stroke="#1B2430" stroke-width="1"/>
  <text x="660" y="373" text-anchor="middle" font-size="11" class="mono" fill="#1B2430">t2</text>
  <rect x="692" y="356" width="48" height="26" rx="3" fill="#D8EEF4" stroke="#1B2430" stroke-width="1"/>
  <text x="716" y="373" text-anchor="middle" font-size="11" class="mono" fill="#1B2430">t3</text>
  <line x1="628" y1="369" x2="636" y2="369" stroke="#1B2430" stroke-width="1.5"/>
  <line x1="684" y1="369" x2="692" y2="369" stroke="#1B2430" stroke-width="1.5"/>
  <text x="660" y="402" text-anchor="middle" font-size="11" fill="#1B2430">any teammate ↔ any teammate, by name</text>
  <text x="660" y="419" text-anchor="middle" font-size="11" fill="#B45309">no broadcast: one message per recipient</text>

  <line x1="760" y1="365" x2="820" y2="365" stroke="#1B2430" stroke-width="1.5" marker-start="url(#a1)" marker-end="url(#a1)"/>
  <rect x="820" y="320" width="150" height="90" rx="4" fill="none" stroke="#1B2430" stroke-width="1"/>
  <text x="895" y="342" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2430">Files on disk</text>
  <text x="895" y="360" text-anchor="middle" font-size="11" class="mono" fill="#1B2430">~/.claude/tasks/</text>
  <text x="895" y="376" text-anchor="middle" font-size="11" class="mono" fill="#1B2430">~/.claude/teams/…/inboxes</text>
  <text x="895" y="396" text-anchor="middle" font-size="11" fill="#5E6B7A">task claims use file locks</text>

  <!-- Row D: Workflow -->
  <line x1="300" y1="480" x2="560" y2="480" stroke="#1B2430" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="430" y="473" text-anchor="middle" font-size="11.5" fill="#1B2430">script (JavaScript)</text>
  <line x1="560" y1="510" x2="300" y2="510" stroke="#0E7490" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="430" y="527" text-anchor="middle" font-size="11.5" fill="#0E7490">script's return value, at the end</text>

  <rect x="560" y="450" width="410" height="130" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.5"/>
  <text x="600" y="474" font-size="14" font-weight="600" fill="#1B2430">Workflow</text>
  <text x="680" y="474" font-size="11.5" fill="#5E6B7A">runtime runs the script; agents never talk to each other</text>
  <rect x="580" y="490" width="80" height="34" rx="3" fill="#D8EEF4" stroke="#1B2430" stroke-width="1"/>
  <text x="620" y="511" text-anchor="middle" font-size="11" class="mono" fill="#1B2430">agent()</text>
  <rect x="680" y="490" width="80" height="34" rx="3" fill="#D8EEF4" stroke="#1B2430" stroke-width="1"/>
  <text x="720" y="511" text-anchor="middle" font-size="11" class="mono" fill="#1B2430">agent()</text>
  <rect x="780" y="490" width="80" height="34" rx="3" fill="#D8EEF4" stroke="#1B2430" stroke-width="1"/>
  <text x="820" y="511" text-anchor="middle" font-size="11" class="mono" fill="#1B2430">agent()</text>
  <line x1="620" y1="524" x2="620" y2="548" stroke="#0E7490" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="720" y1="524" x2="720" y2="548" stroke="#0E7490" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="820" y1="524" x2="820" y2="548" stroke="#0E7490" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="720" y="568" text-anchor="middle" font-size="11.5" class="mono" fill="#1B2430">JSON (schema) → script variables, not your context</text>
  <text x="935" y="511" text-anchor="middle" font-size="11" fill="#5E6B7A">16 at once</text>
  <text x="935" y="527" text-anchor="middle" font-size="11" fill="#5E6B7A">1,000 / run</text>

  <!-- Hooks note -->
  <text x="30" y="440" font-size="12" font-weight="600" fill="#1B2430">Side channel: hooks</text>
  <text x="30" y="458" font-size="11.5" fill="#5E6B7A">SubagentStart injects text into the worker's transcript.</text>
  <text x="30" y="474" font-size="11.5" fill="#5E6B7A">SubagentStop can hold it open or add context to you.</text>
  <text x="30" y="490" font-size="11.5" fill="#5E6B7A">Neither delivers a message agent-to-agent.</text>

  <text x="30" y="530" font-size="12" font-weight="600" fill="#1B2430">What survives a restart</text>
  <text x="30" y="548" font-size="11.5" fill="#5E6B7A">Subagent transcripts: yes, resumable by ID.</text>
  <text x="30" y="564" font-size="11.5" fill="#5E6B7A">Teammates: no. The task list on disk: yes.</text>
  <text x="30" y="580" font-size="11.5" fill="#5E6B7A">Workflow results: replayed within the same session.</text>
</svg>