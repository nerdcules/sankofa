name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: tools the tests and the Native AOT build need
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev jq git inotify-tools libnotify-bin tmux fontconfig libfontconfig1 python3
      - run: make test
