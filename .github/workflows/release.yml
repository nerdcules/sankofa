# Builds the release packages for Linux, macOS and Windows. On a tag (v1.2.3) it also publishes
# them as a GitHub Release; run by hand (workflow_dispatch) it only builds and keeps them as
# workflow artifacts. Every package holds the same programs built from the same code, so any
# of them shares a ledger, a hub and a git remote with any other.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev jq git
      - name: version from the tag, stamped into the build
        id: v
        run: sh .github/version.sh >> "$GITHUB_OUTPUT"
      - run: make dist VERSION=${{ steps.v.outputs.version }} ARCH=${{ matrix.arch }}
      - name: the .deb as dpkg sees it
        run: |
          dpkg-deb --info dist/sankofa_*.deb
          dpkg-deb --contents dist/sankofa_*.deb | awk '{print $6}' | sort
      - name: the tarball installs from where it is unpacked
        run: sh tests/repo/test_dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/sankofa-linux-*.tar.gz
            dist/sankofa_*.deb
  macos:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: brew install jq
      - name: version from the tag, stamped into the build
        id: v
        run: sh .github/version.sh >> "$GITHUB_OUTPUT"
      - name: Apple silicon, Native AOT
        run: make dist VERSION=${{ steps.v.outputs.version }} ARCH=arm64
      - name: the tarball installs from where it is unpacked
        run: sh tests/repo/test_dist.sh
      - name: Intel, cross-built from the same runner
        run: |
          rm -rf bin/out
          make dist VERSION=${{ steps.v.outputs.version }} ARCH=x64 RID=osx-x64
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/sankofa-macos-*.tar.gz
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: version from the tag, stamped into the build
        id: v
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { (Select-String -Path daemon/Sankofa.Core/Store.cs -Pattern 'const string Version = "([^"]*)"').Matches[0].Groups[1].Value }
          (Get-Content daemon/Sankofa.Core/Store.cs) -replace 'const string Version = "[^"]*"', "const string Version = `"$v`"" | Set-Content daemon/Sankofa.Core/Store.cs
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: x64 as Native AOT, arm64 self-contained
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $projects = 'sankofa-cli', 'sankofad', 'sankofa-mcp', 'sankofa-hub', 'sankofa-tui', 'sankofa-gui'
          foreach ($pair in @(@('x64', 'win-x64', ''), @('arm64', 'win-arm64', '-p:PublishAot=false --self-contained'))) {
            $arch, $rid, $extra = $pair
            $out = "dist/sankofa-$v-windows-$arch"
            New-Item -ItemType Directory -Force $out | Out-Null
            foreach ($p in $projects) {
              $args = @('publish', "daemon/$p", '-c', 'Release', '-r', $rid, '-o', "$out", '--nologo', '-v', 'quiet')
              if ($extra) { $args += $extra.Split(' ') }
              & dotnet @args
              if ($LASTEXITCODE -ne 0) { throw "publish $p for $rid failed" }
            }
            Remove-Item "$out/*.pdb" -ErrorAction SilentlyContinue
            Copy-Item -Recurse hooks "$out/hooks"
            Copy-Item AGENTS.md, LICENSE, README.md $out
            Copy-Item packaging/SETUP-windows.txt "$out/SETUP.txt"
            Get-ChildItem $out | Select-Object Name, Length | Format-Table | Out-String | Write-Host
            Compress-Archive -Path $out -DestinationPath "dist/sankofa-windows-$arch.zip" -Force
          }
      - name: the x64 programs answer
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $out = "dist/sankofa-$v-windows-x64"
          & "$out/sankofa.exe" version
          & "$out/sankofad.exe" version
          & "$out/sankofa-gui.exe" version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/sankofa-windows-*.zip
  publish:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: release notes
        run: |
          v=${GITHUB_REF_NAME#v}
          {
            echo "## Get it"
            echo
            echo "See [docs/INSTALL.md](https://github.com/nerdcules/sankofa/blob/$GITHUB_REF_NAME/docs/INSTALL.md) for what each file is and what the install does. Every package holds the same programs, so machines on different systems share one ledger, one hub and one git remote."
            echo
            echo '| Linux | |'
            echo '|---|---|'
            echo "| one line | \`curl -fsSL https://raw.githubusercontent.com/nerdcules/sankofa/main/get.sh \| sh\` |"
            echo "| Debian, Ubuntu, x64 | sankofa_${v}_amd64.deb, then \`sankofa setup\` |"
            echo "| Debian, Ubuntu, arm64 | sankofa_${v}_arm64.deb, then \`sankofa setup\` |"
            echo "| any Linux, x64 | sankofa-linux-x64.tar.gz: unpack, run install.sh |"
            echo "| any Linux, arm64 | sankofa-linux-arm64.tar.gz: unpack, run install.sh |"
            echo "| Arch | \`cd packaging/arch && makepkg -si\` from the source |"
            echo
            echo '| macOS | |'
            echo '|---|---|'
            echo "| one line | the same \`curl ... get.sh \| sh\` |"
            echo "| Apple silicon | sankofa-macos-arm64.tar.gz: unpack, run install.sh |"
            echo "| Intel | sankofa-macos-x64.tar.gz: unpack, run install.sh |"
            echo
            echo '| Windows | |'
            echo '|---|---|'
            echo "| x64 | sankofa-windows-x64.zip: unzip, add to PATH, \`sankofa setup\` |"
            echo "| Arm | sankofa-windows-arm64.zip: the same |"
            echo
            echo "## What changed"
            echo
            echo "See [docs/ROADMAP.md](https://github.com/nerdcules/sankofa/blob/$GITHUB_REF_NAME/docs/ROADMAP.md): each iteration's outcome is written there with its tests and simulations."
          } > notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --title "sankofa $GITHUB_REF_NAME" --notes-file notes.md
          fi
